name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install build tools
        run: brew install cmake ninja xcodegen

      - name: Core — configure, build, test
        working-directory: core
        run: |
          cmake --preset debug
          cmake --build --preset debug
          ctest --preset debug

      - name: Portable Windows libraries — configure, build, test
        working-directory: windows
        run: |
          cmake --preset portable
          cmake --build --preset portable
          ctest --preset portable

      - name: Format, lint and localization checks
        run: scripts/lint.sh

      - name: Swift package — build and test
        run: swift test

      - name: macOS app — generate, build, test
        working-directory: macos
        run: |
          xcodegen generate
          xcodebuild -project Osdrop.xcodeproj -scheme Osdrop -destination 'platform=macOS' \
            -derivedDataPath DerivedData -quiet test

  macos-sanitizers:
    name: macOS sanitizers
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        run: brew install cmake ninja

      - name: Core — AddressSanitizer and UndefinedBehaviorSanitizer
        working-directory: core
        run: |
          cmake --preset asan
          cmake --build --preset asan
          ctest --preset asan

      - name: Core — ThreadSanitizer
        working-directory: core
        run: |
          cmake --preset tsan
          cmake --build --preset tsan
          ctest --preset tsan

  fuzz:
    name: Decoder fuzzing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the fuzzers (Clang, libFuzzer, ASan, UBSan)
        run: |
          cmake -S core -B build/fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ -DOSDROP_CORE_BUILD_FUZZER=ON -DOSDROP_CORE_BUILD_TESTS=OFF
          cmake --build build/fuzz --parallel

      - name: Seed the corpora with the protocol fixtures and the fuzz seeds
        run: |
          for kind in control input transfer discovery crypto group layout; do
            mkdir -p "build/corpus/$kind"
          done
          while IFS=$'\t' read -r file kind _; do
            case "$file" in '#'*|'') continue ;; esac
            cp "protocol/fixtures/$file" "build/corpus/$kind/$(echo "$file" | tr / _)"
          done < protocol/fixtures/manifest.tsv
          cp core/fuzz/seeds/discovery_* build/corpus/discovery/
          cp build/corpus/control/* build/corpus/input/* build/corpus/crypto/
          cp build/corpus/control/* core/fuzz/seeds/group_* build/corpus/group/
          cp build/corpus/control/* core/fuzz/seeds/layout_* build/corpus/layout/

      - name: Fuzz each decoder, the crypto parsers, the group and the layout for 30 seconds
        run: |
          build/fuzz/fuzz/osdrop_control_fuzzer -max_total_time=30 -max_len=65537 build/corpus/control
          build/fuzz/fuzz/osdrop_input_fuzzer -max_total_time=30 -max_len=1185 build/corpus/input
          build/fuzz/fuzz/osdrop_transfer_fuzzer -max_total_time=30 -max_len=65537 build/corpus/transfer
          build/fuzz/fuzz/osdrop_discovery_fuzzer -max_total_time=30 -max_len=512 build/corpus/discovery
          build/fuzz/fuzz/osdrop_crypto_fuzzer -max_total_time=30 -max_len=2048 build/corpus/crypto
          build/fuzz/fuzz/osdrop_group_fuzzer -max_total_time=30 -max_len=65537 build/corpus/group
          build/fuzz/fuzz/osdrop_layout_fuzzer -max_total_time=30 -max_len=65537 build/corpus/layout

  windows:
    name: Windows
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: windows/app/global.json

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Native — configure, build, test, clang-tidy
        working-directory: windows
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          . ../scripts/windows/Enter-DevShell.ps1
          cmake --preset debug
          cmake --build --preset debug
          ctest --preset debug
          python ../scripts/run_clang_tidy.py windows/build/debug core/src windows/

      - name: Shell — format check
        working-directory: windows/app
        run: dotnet format Osdrop.slnx --verify-no-changes

      - name: Shell — build
        working-directory: windows/app
        run: dotnet build Osdrop.slnx -c Release

      - name: Shell — test
        working-directory: windows/app
        run: dotnet test --solution Osdrop.slnx -c Release --no-build
