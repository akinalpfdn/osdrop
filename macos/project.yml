name: Osdrop
options:
  bundleIdPrefix: com.akinalpfdn
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  OsdropCore:
    path: ..
settings:
  base:
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Osdrop:
    type: application
    platform: macOS
    sources:
      - path: Osdrop
      # Definitions the app shares with its capture guard and its network helper.
      - path: Shared
      # The network helper's launchd job, registered with SMAppService from the app's bundle.
      - path: OsdropNetworkHelper/com.akinalpfdn.osdrop.network-helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: OsdropCore
        product: CoreBridge
      - target: OsdropCaptureGuard
        embed: true
        codeSign: true
        copy:
          destination: executables
      - target: OsdropNetworkHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akinalpfdn.osdrop
        PRODUCT_NAME: Osdrop
        INFOPLIST_FILE: Osdrop/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
  # Ends Osdrop if it hangs while capturing input, so the cursor always comes back (DEVPLAN,
  # input safety invariants). Lives next to the app's executable in Contents/MacOS.
  OsdropCaptureGuard:
    type: tool
    platform: macOS
    sources:
      - path: OsdropCaptureGuard
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: OsdropCaptureGuard
        PRODUCT_BUNDLE_IDENTIFIER: com.akinalpfdn.osdrop.captureguard
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  # Keeps AWDL off while the app asks for it (PHASE-024-NET-01); runs as root under launchd.
  OsdropNetworkHelper:
    type: tool
    platform: macOS
    sources:
      - path: OsdropNetworkHelper
        excludes:
          - "*.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: OsdropNetworkHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.akinalpfdn.osdrop.network-helper
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  # The iPhone app (DEVPLAN Phase 22). It builds the Mac's Bonjour and key store sources as they
  # are; its own Log and Tunables give them the names they use.
  OsdropPhone:
    type: application
    platform: iOS
    sources:
      - path: OsdropPhone
      - path: OsdropPhoneShared
      - path: Osdrop/Services/Discovery
      - path: Osdrop/Services/KeyStore
    dependencies:
      - package: OsdropCore
        product: CoreBridge
      - target: OsdropPhoneShare
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akinalpfdn.osdrop.ios
        PRODUCT_NAME: Osdrop
        INFOPLIST_FILE: OsdropPhone/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: OsdropPhone/Resources/OsdropPhone.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # The share sheet's Osdrop: it leaves the shared files in the App Group for the app to send.
  OsdropPhoneShare:
    type: app-extension
    platform: iOS
    sources:
      - path: OsdropPhoneShare
        excludes:
          - "*.entitlements"
      - path: OsdropPhoneShared
      - path: OsdropPhone/Theme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akinalpfdn.osdrop.ios.share
        PRODUCT_NAME: OsdropShare
        INFOPLIST_FILE: OsdropPhoneShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: OsdropPhoneShare/OsdropPhoneShare.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  OsdropPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OsdropPhoneTests
    dependencies:
      - target: OsdropPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akinalpfdn.osdrop.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Osdrop.app/Osdrop
  OsdropTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OsdropTests
    dependencies:
      - target: Osdrop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akinalpfdn.osdrop.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Osdrop.app/Contents/MacOS/Osdrop
  OsdropHardwareTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OsdropHardwareTests
    dependencies:
      - target: Osdrop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akinalpfdn.osdrop.hardwaretests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Osdrop.app/Contents/MacOS/Osdrop
schemes:
  Osdrop:
    build:
      targets:
        Osdrop: all
        OsdropTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - OsdropTests
  OsdropPhone:
    build:
      targets:
        OsdropPhone: all
        OsdropPhoneTests: [test]
    test:
      config: Debug
      targets:
        - OsdropPhoneTests
  # Moves the real cursor and captures input on the machine running it; not part of CI.
  OsdropHardware:
    build:
      targets:
        Osdrop: all
        OsdropHardwareTests: [test]
    test:
      config: Debug
      targets:
        - OsdropHardwareTests
