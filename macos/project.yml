name: Osdrop
options:
  bundleIdPrefix: com.akinalpfdn
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  OsdropCore:
    path: ..
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Osdrop:
    type: application
    platform: macOS
    sources:
      - path: Osdrop
    dependencies:
      - package: OsdropCore
        product: CoreBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akinalpfdn.osdrop
        PRODUCT_NAME: Osdrop
        INFOPLIST_FILE: Osdrop/Resources/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
  OsdropTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OsdropTests
    dependencies:
      - target: Osdrop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akinalpfdn.osdrop.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Osdrop.app/Contents/MacOS/Osdrop
  OsdropHardwareTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OsdropHardwareTests
    dependencies:
      - target: Osdrop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akinalpfdn.osdrop.hardwaretests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Osdrop.app/Contents/MacOS/Osdrop
schemes:
  Osdrop:
    build:
      targets:
        Osdrop: all
        OsdropTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - OsdropTests
  # Moves the real cursor and captures input on the machine running it; not part of CI.
  OsdropHardware:
    build:
      targets:
        Osdrop: all
        OsdropHardwareTests: [test]
    test:
      config: Debug
      targets:
        - OsdropHardwareTests
